<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trà Đá Với AI</title>
<meta name="description" content="Tèo hỏi, Bíp đáp, chuyện AI bên ly trà đá. Xem Trà Đá Với AI trên TikTok, YouTube và Facebook. Tập mới 19:00 mỗi ngày.">
<meta name="theme-color" content="#0b1f2a">
<meta property="og:type" content="website">
<meta property="og:title" content="Trà Đá Với AI">
<meta property="og:description" content="Tèo hỏi, Bíp đáp, chuyện AI bên ly trà đá. Tập mới 19:00 mỗi ngày.">
<meta property="og:image" content="https://tradavoiai.github.io/avatar.png">
<meta property="og:url" content="https://tradavoiai.github.io/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="avatar.png">
<style>
:root{--bg1:#07151d;--bg2:#0f2d2a;--lantern:#ffc83d;--red:#d8432f;--green:#2f9e6b;--text:#fff7e0;--muted:#cfd9d2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);
 font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
 background:radial-gradient(120% 60% at 50% 0%,rgba(255,200,61,.22),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));
 display:flex;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;text-align:center;position:relative}
.lanterns{display:flex;justify-content:space-between;padding:0 18px;margin-bottom:-14px}
.lanterns i{width:26px;height:34px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 40%,#ffe58a,var(--lantern) 55%,#e08a1c);
 box-shadow:0 0 22px 6px rgba(255,200,61,.55);position:relative;animation:glow 3.6s ease-in-out infinite}
.lanterns i:nth-child(2){animation-delay:-1.8s;background:radial-gradient(circle at 50% 40%,#ff9a85,var(--red) 60%,#a22a1b);box-shadow:0 0 22px 6px rgba(216,67,47,.5)}
.lanterns i::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:14px;background:#8a6a3a}
@keyframes glow{50%{filter:brightness(.8);box-shadow:0 0 14px 3px rgba(255,200,61,.35)}}
.avatar{position:relative;width:132px;height:132px;margin:0 auto 14px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--lantern);box-shadow:0 0 28px rgba(255,200,61,.45);background:#123}
.steam{position:absolute;right:-6px;top:-18px;width:30px;height:34px}
.steam span{position:absolute;bottom:0;width:5px;height:18px;border-radius:5px;background:rgba(255,255,255,.55);filter:blur(2px);animation:steam 3s ease-in infinite;opacity:0}
.steam span:nth-child(1){left:4px}.steam span:nth-child(2){left:13px;animation-delay:1s}.steam span:nth-child(3){left:22px;animation-delay:2s}
@keyframes steam{0%{transform:translateY(8px) scaleY(.6);opacity:0}30%{opacity:.7}100%{transform:translateY(-22px) scaleY(1.2);opacity:0}}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px;letter-spacing:.2px}
.tag{margin:0 0 26px;color:var(--lantern);font-size:1.08rem;font-weight:600}
.links{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.btn{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 20px;border-radius:20px;text-decoration:none;color:#1a1206;font-weight:800;font-size:1.2rem;
 background:var(--lantern);box-shadow:0 5px 0 #b57f0f,0 10px 24px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57f0f,0 4px 10px rgba(0,0,0,.35)}
.btn svg{flex:none;width:32px;height:32px}
.btn span{flex:1;text-align:left}
.btn small{display:block;font-weight:600;font-size:.82rem;opacity:.75}
.btn.yt{background:#ff7b63;box-shadow:0 5px 0 #a8321f,0 10px 24px rgba(0,0,0,.35)}
.btn.fb{background:#7fd6a8;box-shadow:0 5px 0 #2d7d56,0 10px 24px rgba(0,0,0,.35)}
.btn.tt{font-size:1.28rem}
a:focus-visible{outline:4px solid #fff;outline-offset:3px}
.when{margin:26px 0 0;font-size:1rem;color:var(--text)}
.when b{color:var(--lantern)}
footer{margin-top:28px;font-size:.9rem}
footer a{color:var(--muted);padding:10px 8px;display:inline-block}
.ant{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:middle;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.steam{display:none}}
</style>
</head>
<body>
<main>
  <div class="lanterns" aria-hidden="true"><i></i><i></i></div>
  <div class="avatar">
    <img src="avatar.png" width="132" height="132" alt="Tèo và Bíp, nhân vật của kênh Trà Đá Với AI">
    <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <h1>Trà Đá Với AI</h1>
  <p class="tag">Tèo hỏi, Bíp đáp, chuyện AI bên ly trà đá.</p>
  <ul class="links">
    <li><a class="btn tt" href="https://www.tiktok.com/@teovabip" rel="noopener">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#1a1206" d="M20 3h-4v18.2a3.7 3.7 0 1 1-3.7-3.7c.4 0 .7 0 1 .1v-4.1a7.8 7.8 0 1 0 6.8 7.7V12a9 9 0 0 0 5.2 1.7V9.6A5.3 5.3 0 0 1 20 3z"/></svg>
      <span>TikTok<small>Xem tập ngắn</small></span></a></li>
    <li><a class="btn yt" href="https://www.youtube.com/@tradavoiai" rel="noopener">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="7" fill="#1a1206"/><path fill="#ff7b63" d="M13 11.5v9l8-4.5z"/></svg>
      <span>YouTube<small>Xem và đăng ký kênh</small></span></a></li>
    <li><a class="btn fb" href="https://www.facebook.com/profile.php?id=61595532733575" rel="noopener">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="11" r="4.5" fill="#1a1206"/><circle cx="22" cy="12" r="3.8" fill="#1a1206"/><path fill="#1a1206" d="M2.5 26c0-5 3.6-8 8.5-8s8.5 3 8.5 8zM19 26c.2-3 1.6-5.2 3.6-6.3 3.8 0 6.9 2 6.9 6.3z"/></svg>
      <span>Facebook<small>Theo dõi trang</small></span></a></li>
  </ul>
  <p class="when"><span class="ant" aria-hidden="true"></span>Tập mới <b>19:00</b> mỗi ngày</p>
  <footer><a href="privacy.html">Chính sách riêng tư</a></footer>
</main>
</body>
</html>
